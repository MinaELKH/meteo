<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Météo</title>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
    }
    
    .weather-app {
      max-width: 600px;
      margin: 2rem auto;
      padding: 2rem;
      border-radius: 15px;
      background-image: url('https://source.unsplash.com/1600x900/?spring');
      background-size: cover;
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.15);
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    
    .header h1 {
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
    }
    
    .search-section {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    
    input {
      flex: 1;
      padding: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 1rem;
    }
    
    button {
      padding: 0.8rem 1.2rem;
      border: none;
      background: #3498db;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
    }
    
    button:hover {
      background-color: #2980b9;
    }
    
    select {
      padding: 0.8rem;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 10px;
    }
    
    .current-weather {
      background: rgba(255, 255, 255, 0.8);
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .current-weather img {
      width: 80px;
      height: 80px;
      margin-bottom: 1rem;
    }
    
    .condition {
      font-size: 1.2rem;
      font-weight: bold;
      color: #333;
    }
    
    .weather-details p {
      margin: 0.5rem 0;
    }
    
    .forecast {
      margin-top: 2rem;
      background: rgba(255, 255, 255, 0.8);
      padding: 1.5rem;
      border-radius: 15px;
    }
    
    .forecast h3 {
      margin-top: 0;
      text-align: center;
    }
    
    .forecast-items {
      display: flex;
      overflow-x: auto;
      gap: 1rem;
      padding-bottom: 1rem;
    }
    
    .forecast-item {
      flex-shrink: 0;
      background: white;
      border-radius: 10px;
      padding: 1rem;
      width: 150px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    
    .forecast-item img {
      width: 50px;
      height: 50px;
    }
  </style>
</head>
<body>
  <div class="weather-app" id="app">
    <div class="header">
      <h1 id="title">Application Météo</h1>
      <select id="language-select">
        <option value="en">English</option>
        <option value="fr" selected>Français</option>
      </select>
    </div>

    <div class="search-section">
      <input id="city-input" placeholder="Entrez une ville" />
      <button id="search-button">Rechercher</button>
      <button id="location-button">Utiliser ma position</button>
    </div>

    <div id="current-weather" class="current-weather" style="display: none;">
      <h2 id="location"></h2>
      <img id="weather-icon" alt="weather icon" />
      <p class="condition" id="condition-text"></p>
      <div class="weather-details">
        <p id="temperature"></p>
        <p id="humidity"></p>
        <p id="wind-speed"></p>
      </div>
    </div>

    <div id="forecast" class="forecast" style="display: none;">
      <h3 id="forecast-title">Prochaines 3 heures</h3>
      <div class="forecast-items" id="forecast-items">
        <!-- Forecast items will be added here dynamically -->
      </div>
    </div>
  </div>

  <script>
    // Application state
    const state = {
      API_KEY: '1d493fb85b524203af5111937251704',
      city: '',
      weather: null,
      forecast: [],
      lang: 'fr'
    };

    // Translations
    const translations = {
      en: {
        title: 'Weather App',
        enterCity: 'Enter city',
        search: 'Search',
        temp: 'Temperature',
        humidity: 'Humidity',
        wind: 'Wind Speed',
        shortForecast: 'Next 3 hours',
        useLocation: 'Use My Location'
      },
      fr: {
        title: 'Application Météo',
        enterCity: 'Entrez une ville',
        search: 'Rechercher',
        temp: 'Température',
        humidity: 'Humidité',
        wind: 'Vitesse du vent',
        shortForecast: 'Prochaines 3 heures',
        useLocation: 'Utiliser ma position'
      }
    };

    // DOM Elements
    const elements = {
      title: document.getElementById('title'),
      cityInput: document.getElementById('city-input'),
      searchButton: document.getElementById('search-button'),
      locationButton: document.getElementById('location-button'),
      langSelect: document.getElementById('language-select'),
      currentWeather: document.getElementById('current-weather'),
      location: document.getElementById('location'),
      weatherIcon: document.getElementById('weather-icon'),
      conditionText: document.getElementById('condition-text'),
      temperature: document.getElementById('temperature'),
      humidity: document.getElementById('humidity'),
      windSpeed: document.getElementById('wind-speed'),
      forecast: document.getElementById('forecast'),
      forecastTitle: document.getElementById('forecast-title'),
      forecastItems: document.getElementById('forecast-items')
    };

    // Helper functions
    function t(key) {
      return translations[state.lang][key] || key;
    }

    function updateUILanguage() {
      elements.title.textContent = t('title');
      elements.cityInput.placeholder = t('enterCity');
      elements.searchButton.textContent = t('search');
      elements.locationButton.textContent = t('useLocation');
      elements.forecastTitle.textContent = t('shortForecast');
      
      // Update weather display if available
      if (state.weather) {
        updateWeatherDisplay();
      }
    }

    function getIconUrl(iconPath) {
      return `https:${iconPath}`;
    }

    function formatHour(dateString) {
      const date = new Date(dateString);
      return date.toLocaleTimeString(state.lang, { hour: '2-digit', minute: '2-digit' });
    }

    // API functions
    async function fetchWeather() {
      if (!state.city) return;
      
      try {
        const url = `https://api.weatherapi.com/v1/forecast.json?key=${state.API_KEY}&q=${state.city}&lang=${state.lang}&hours=3`;
        const response = await fetch(url);
        const data = await response.json();
        
        state.weather = data;
        state.forecast = data.forecast.forecastday[0].hour;
        
        updateWeatherDisplay();
      } catch (error) {
        console.error('Error fetching weather data:', error);
        alert('Erreur lors de la récupération des données météo. Veuillez réessayer.');
      }
    }

    function updateWeatherDisplay() {
      if (!state.weather) return;
      
      // Update current weather
      elements.currentWeather.style.display = 'block';
      elements.location.textContent = `${state.weather.location.name}, ${state.weather.location.country}`;
      elements.weatherIcon.src = getIconUrl(state.weather.current.condition.icon);
      elements.conditionText.textContent = state.weather.current.condition.text;
      elements.temperature.textContent = `${t('temp')}: ${state.weather.current.temp_c} °C`;
      elements.humidity.textContent = `${t('humidity')}: ${state.weather.current.humidity}%`;
      elements.windSpeed.textContent = `${t('wind')}: ${state.weather.current.wind_kph} km/h`;
      
      // Update forecast
      if (state.forecast.length > 0) {
        elements.forecast.style.display = 'block';
        elements.forecastItems.innerHTML = '';
        
        // Display the next 3 hours
        const nextHours = state.forecast.slice(0, 3);
        nextHours.forEach(hour => {
          const forecastItem = document.createElement('div');
          forecastItem.className = 'forecast-item';
          
          const timeElement = document.createElement('p');
          timeElement.textContent = formatHour(hour.time);
          
          const icon = document.createElement('img');
          icon.src = getIconUrl(hour.condition.icon);
          icon.alt = 'weather icon';
          
          const temp = document.createElement('p');
          temp.textContent = `${hour.temp_c} °C`;
          
          forecastItem.appendChild(timeElement);
          forecastItem.appendChild(icon);
          forecastItem.appendChild(temp);
          
          elements.forecastItems.appendChild(forecastItem);
        });
      }
    }

    function useGeolocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async position => {
          const { latitude, longitude } = position.coords;
          
          try {
            const url = `https://api.weatherapi.com/v1/forecast.json?key=${state.API_KEY}&q=${latitude},${longitude}&lang=${state.lang}&hours=3`;
            const response = await fetch(url);
            const data = await response.json();
            
            state.weather = data;
            state.city = data.location.name;
            state.forecast = data.forecast.forecastday[0].hour;
            
            elements.cityInput.value = state.city;
            updateWeatherDisplay();
          } catch (error) {
            console.error('Error fetching weather data:', error);
            alert('Erreur lors de la récupération des données météo. Veuillez réessayer.');
          }
        }, error => {
          console.error('Geolocation error:', error);
          alert('Impossible d\'obtenir votre position. Veuillez autoriser l\'accès à votre position ou entrer une ville manuellement.');
        });
      } else {
        alert('La géolocalisation n\'est pas prise en charge par votre navigateur.');
      }
    }

    // Event listeners
    elements.searchButton.addEventListener('click', () => {
      state.city = elements.cityInput.value.trim();
      fetchWeather();
    });

    elements.cityInput.addEventListener('keyup', event => {
      if (event.key === 'Enter') {
        state.city = elements.cityInput.value.trim();
        fetchWeather();
      }
    });

    elements.locationButton.addEventListener('click', useGeolocation);

    elements.langSelect.addEventListener('change', () => {
      state.lang = elements.langSelect.value;
      updateUILanguage();
      if (state.city) {
        fetchWeather();
      }
    });

    // Initialize the app
    window.addEventListener('DOMContentLoaded', () => {
      updateUILanguage();
    });
  </script>
</body>
</html>
